<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Penfield Desk{% endblock %}</title>
  <link rel="icon" href="data:,">
  <!-- 422 carries the refusal reasons for sign-off, corrections and the reply log,
       so swap it in like a success. htmx 2 drops every 4xx by default. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/desk.css">
  <link rel="stylesheet" href="/static/cockpit.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/desk.js" defer></script>
  <script src="/static/cockpit.js" defer></script>
</head>
<body class="cockpit">
{% include "_appbar.html" %}
{% block main %}{% endblock %}
<div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
